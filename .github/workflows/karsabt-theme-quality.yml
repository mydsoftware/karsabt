name: Karsabt Theme Quality

on:
  push:
    branches: [main, 'security/**']
    paths:
      - "wordpress/wp-content/themes/karsabt/**"
      - "wordpress/wp-content/plugins/karsabt-core/**"
      - ".github/workflows/karsabt-theme-quality.yml"
      - "tests/php/karsabt-theme-quality-test.php"
  pull_request:
    paths:
      - "wordpress/wp-content/themes/karsabt/**"
      - "wordpress/wp-content/plugins/karsabt-core/**"
      - "tests/php/karsabt-theme-quality-test.php"
      - ".github/workflows/karsabt-theme-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-and-json:
    name: PHP syntax and theme JSON
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: تنظیم PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: بررسی نگارش فایل‌های PHP قالب
        shell: bash
        run: |
          set -euo pipefail
          theme="wordpress/wp-content/themes/karsabt"
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find "$theme" -type f -name '*.php' -print0)

      - name: بررسی ساختار theme.json
        run: php -r '$data = json_decode(file_get_contents("wordpress/wp-content/themes/karsabt/theme.json"), true, 512, JSON_THROW_ON_ERROR); if (!is_array($data) || !isset($data["version"])) { fwrite(STDERR, "theme.json structure is invalid\n"); exit(1); } echo "theme.json is valid\n";'


      - name: اجرای آزمون‌های ایستای قالب کارثبت
        run: php tests/php/karsabt-theme-quality-test.php
